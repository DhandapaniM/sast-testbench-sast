name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

  #schedule:
   # - cron: '15 3 * * 3'

  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    permissions:
      # Required to upload CodeQL findings to GitHub Code Scanning
      security-events: write

      # Required for private/internal CodeQL packs
      packages: read

      # Required for repository checkout / workflow access
      actions: read
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:
          - language: c-cpp
            build-mode: none

          - language: javascript-typescript
            build-mode: none

          - language: python
            build-mode: none

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------------
      # 2. Initialize CodeQL
      #
      # security-extended:
      #   Additional security-focused CodeQL queries
      #
      # security-and-quality:
      #   Additional security + code-quality queries
      #
      # This gives broader coverage than the default query suite.
      # ---------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

          queries: security-extended,security-and-quality


      # ---------------------------------------------------------
      # 3. Manual build
      #
      # Currently your configured languages use build-mode: none,
      # therefore this step will normally be skipped.
      #
      # Keep this section if you later change a compiled language
      # to build-mode: manual.
      # ---------------------------------------------------------
      - name: Run manual build steps

        if: matrix.build-mode == 'manual'

        shell: bash

        run: |
          echo 'Manual build mode is configured.'
          echo 'Replace this step with your real application build.'
          echo 'Examples:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1


      # ---------------------------------------------------------
      # 4. Perform CodeQL analysis
      #
      # Important:
      #
      # output:
      #   Writes the CodeQL SARIF files to disk.
      #
      # upload: always
      #   Also uploads the findings into GitHub Code Scanning.
      #
      # Therefore you get BOTH:
      #
      #   GitHub Code Scanning alerts
      #             +
      #   downloadable SARIF reports
      # ---------------------------------------------------------
      - name: Perform CodeQL Analysis

        id: codeql-analysis

        uses: github/codeql-action/analyze@v4

        with:

          category: "/language:${{ matrix.language }}"

          output: sarif-results/${{ matrix.language }}

          upload: always


      # ---------------------------------------------------------
      # 5. Upload SARIF report as GitHub Actions artifact
      #
      # if: always()
      #
      # Ensures the SARIF artifact upload is attempted even if
      # another part of the analysis reports a problem.
      #
      # Each language produces its own artifact.
      # ---------------------------------------------------------
      - name: Upload CodeQL SARIF Report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: codeql-sarif-${{ matrix.language }}-${{ github.run_number }}

          path: sarif-results/${{ matrix.language }}/

          if-no-files-found: warn

          retention-days: 90
